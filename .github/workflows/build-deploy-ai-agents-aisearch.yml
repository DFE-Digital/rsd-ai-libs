name: CI & Pack GovUK.Dfe.AI.Agents.AISearch

on:
  push:
    branches: [ main ]
    paths:
      - "src/GovUK.Dfe.AI.Agents.AISearch/**"
  pull_request:
    branches: [ main ]
    paths:
      - "src/GovUK.Dfe.AI.Agents.AISearch/**"

jobs:
  build-and-test:
    uses: ./.github/workflows/build-test-template.yml
    with:
      project_name: GovUK.Dfe.AI.Agents.AISearch
      project_path: src/GovUK.Dfe.AI.Agents.AISearch

  pack-and-release:
    needs: build-and-test
    if: needs.build-and-test.result == 'success'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/pack-template.yml
    with:
      project_name: GovUK.Dfe.AI.Agents.AISearch
      project_path: src/GovUK.Dfe.AI.Agents.AISearch/GovUK.Dfe.AI.Agents.AISearch.csproj
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
